name: CI

on:
  push:
    branches:
      - main
  # Branches are covered by `pull_request`, not by `push`. Listing both for every
  # branch ran the whole workflow — including the 10x-billed macOS job — twice on
  # each push to a branch with an open PR.
  pull_request:
  # Kept so CI can be run by hand against a branch that has no PR open yet.
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Deploy the worker afterwards, even if it did not change (main only)
        type: boolean
        default: false

# A new push supersedes whatever is still running for the same ref. `main` is
# exempt: those runs are the record of what landed, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  # Referenced by the cache keys below as well as by setup-node: a bump has to
  # invalidate the cached `node_modules`, or CI restores a tree built against the
  # old ABI and then skips `npm ci` entirely.
  NODE_VERSION: 22

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Check vulnerabilities
        run: npm audit --audit-level=high

      # Together with the `e2e` job below, these cover everything `npm run check`
      # runs locally, in the same relative order — plus the build, coverage and
      # audit steps that only make sense in CI.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `prebuild:site` generates the test data if `data/` is absent, which it
      # always is on a fresh checkout.
      #
      # Before the tests, not after: `src/build_output.test.ts` asserts against
      # the built site and shells out to this same command in `beforeAll` when
      # `build/` is missing. Building here means that happens once, not twice.
      - name: Build site
        run: npm run build:site

      # `vitest run --coverage`, which is a superset of `npm run test` — running
      # both meant the whole suite executed twice per job.
      - name: Tests
        run: npm run test-coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # The worker is a separate package with its own lockfile, so it needs its
      # own install. Without this it is only ever typechecked on a laptop, while
      # being the thing that actually serves the site.
      - name: Cache Worker Node Modules
        id: cache-worker-node-modules
        uses: actions/cache@v6
        with:
          path: worker/node_modules
          key: worker-node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.cache-worker-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: worker

      # The root audit above does not reach here: the worker has its own lockfile,
      # and its dependencies (wrangler and everything under it) are invisible to
      # it. A high-severity advisory sat in this tree while CI stayed green.
      - name: Check worker vulnerabilities
        run: npm audit --audit-level=high
        working-directory: worker

      - name: Check worker
        run: npm run check
        working-directory: worker

  # Kept separate from `check` so the lint/typecheck/unit feedback is not held
  # up by a browser download, and so a UI regression is reported as its own
  # failure rather than as "tests failed".
  e2e:
    name: Browser tests
    # macOS, not ubuntu: WebGL2 works here, so the map tests actually run instead
    # of skipping themselves, and Playwright's WebKit is a Mac build against the
    # same system frameworks Safari uses rather than the Linux GTK/WPE one.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Always run, cache hit or not: `.npmrc` sets `ignore-scripts=true`, so npm
      # never installs the browsers itself. It is a no-op once they are present.
      # No `--with-deps` — that flag only exists for Ubuntu.
      - name: Install browsers
        run: npx playwright install chromium firefox webkit

      # Builds the site and serves it; see `webServer` in playwright.config.ts.
      # That build runs `prebuild:site`, which generates the test data.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Decides whether a push to `main` has a worker to deploy. A job of its own,
  # without the environment: a push that leaves `worker/` alone then never
  # touches the deployment environment, or waits for its approval if it has one.
  worker-changes:
    name: Worker changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_worker)
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The full history: the push may contain several commits, and the diff
          # below spans all of them.
          fetch-depth: 0

      # A manual run always deploys, and so does a push whose previous state is
      # unknown.
      - name: Check whether the worker changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.deploy_worker }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- worker/; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "The worker did not change; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploys the Cloudflare Worker once the commit that changed it has passed
  # every check. Until now this was `npm run deploy` on a laptop, so what ran in
  # production was whatever someone last remembered to upload.
  deploy-worker:
    name: Deploy worker
    needs: [check, e2e, worker-changes]
    if: needs.worker-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Holds the Cloudflare credentials, so that only this job — and only on
    # `main`, if the environment is restricted to it — can read them.
    environment: worker
    # Never two deployments at once, and never cancel one halfway.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Without the credentials this job reports why it did nothing instead of
      # failing every worker change until someone has set the environment up.
      - name: Check credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The worker changed but was not deployed: set CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable) in the 'worker' environment."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install worker dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci
        working-directory: worker

      - name: Deploy
        if: steps.credentials.outputs.available == 'true'
        run: npm run deploy
        working-directory: worker
