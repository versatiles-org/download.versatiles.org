version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    versioning-strategy: increase-if-necessary

  # The worker has its own package.json and lockfile, so the entry above does not
  # reach it — without this it never gets updates or advisories, while being the
  # thing that actually serves the site.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    groups:
      worker:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      action:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
