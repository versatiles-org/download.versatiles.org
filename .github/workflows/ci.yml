name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '!**' # Don't run twice on commits with tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  release:
    name: Lint, test and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Check vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build site
        run: npx tsx src/generate_testdata.ts && npm run build:site

      - name: Generate test coverage
        run: npm run test-coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Kept separate from `release` so the lint/typecheck/unit feedback is not held
  # up by a browser download, and so a UI regression is reported as its own
  # failure rather than as "tests failed".
  e2e:
    name: Browser tests
    # macOS, not ubuntu: WebGL2 works here, so the map tests actually run instead
    # of skipping themselves, and Playwright's WebKit is a Mac build against the
    # same system frameworks Safari uses rather than the Linux GTK/WPE one.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Always run, cache hit or not: `.npmrc` sets `ignore-scripts=true`, so npm
      # never installs the browsers itself. It is a no-op once they are present.
      # No `--with-deps` — that flag only exists for Ubuntu.
      - name: Install browsers
        run: npx playwright install chromium firefox webkit

      - name: Generate test data
        run: npx tsx src/generate_testdata.ts

      # Builds the site and serves it; see `webServer` in playwright.config.ts.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
