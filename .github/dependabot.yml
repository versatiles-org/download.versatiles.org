version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    versioning-strategy: increase-if-necessary
    ignore:
      # typescript-eslint peers on `>=4.8.4 <6.1.0`, and other tooling lags the same way, so a
      # TypeScript 7 bump breaks `npm ci` outright. Drop this once typescript-eslint accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The worker has its own package.json and lockfile, so the entry above does not
  # reach it — without this it never gets updates or advisories, while being the
  # thing that actually serves the site.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    groups:
      worker:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    versioning-strategy: increase-if-necessary
    ignore:
      # typescript-eslint peers on `>=4.8.4 <6.1.0`, and other tooling lags the same way, so a
      # TypeScript 7 bump breaks `npm ci` outright. Drop this once typescript-eslint accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      action:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
